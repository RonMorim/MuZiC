name: Analyse previews
# Measures tempo / beat grid / key of the official iTunes previews in the cloud (free for public repos).
# Only the numbers are committed; no audio is stored anywhere.
on:
  workflow_dispatch:
    inputs:
      set:
        description: "set config"
        default: "sets/megamix1.json"

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q numpy scipy librosa soundfile
      - name: Analyse
        run: python mixer/analyze_previews.py "${{ inputs.set }}" "${{ inputs.set }}.tmp"
      - name: Commit analysis
        run: |
          out="${{ inputs.set }}"; out="${out%.json}.analysis.json"
          mv "${{ inputs.set }}.tmp" "$out"
          git config user.name "muzic-bot"
          git config user.email "muzic-bot@users.noreply.github.com"
          git add "$out"
          git commit -qm "Analyse previews for ${{ inputs.set }}" && git push -q origin HEAD:main || echo "no change"
