name: Build party catalog
# Measures tempo / key / energy of the wedding party songs from official iTunes previews (cloud only, free).
# Only numbers are committed (data/party.js); no audio is stored.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q numpy scipy librosa soundfile
      - name: Build
        run: python mixer/build_party_catalog.py data/party_list.txt data/party.js
      - name: Commit
        run: |
          git config user.name "muzic-bot"
          git config user.email "muzic-bot@users.noreply.github.com"
          git add data/party.js
          git commit -qm "Build party catalog" && git pull -q --rebase origin main && git push -q origin HEAD:main || echo "no change"
